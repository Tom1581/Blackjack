name: blackjack_app
description: Blackjack with Hi-Lo card counting — Android & iOS

publish_to: 'none'
version: 1.3.0+11

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  flutter_riverpod: ^2.5.1
  google_mobile_ads: ^8.0.0
  in_app_review: ^2.0.9
  riverpod_annotation: ^2.3.5
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  # The pure-Dart client. The transport layer uses this rather than
  # supabase_flutter so it can be driven from a plain `dart run` script
  # against the live service, with no Flutter bindings.
  supabase: ^2.14.0
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
  # Imported directly by tool/realtime_live_check.dart.
  realtime_client: ^2.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/sfx/
